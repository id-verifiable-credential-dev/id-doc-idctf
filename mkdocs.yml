# Project information
site_name: Indonesia Digital Credential Trust Framework
site_description: Indonesia Digital Credential Trust Framework
repo_url: https://github.com/id-verifiable-credential-dev/id-doc-idctf
repo_name: id-doc-idctf
# Read by the `content.action.edit` and `content.action.view` features in
# theme.features; without these the Edit / View source buttons never render.
edit_uri: edit/main/docs/

# Configuration
theme:
  name: material
  language: en
  # Holds only the `outdated` block — the outdated-version banner.
  custom_dir: overrides
  features:
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    # navigation.instant is NOT compatible with the i18n plugin's language
    # switcher — do not switch it back on while the toggle is in use.
    - navigation.path
    # navigation.sections is deliberately unused: chapters now hold section
    # pages, and always-open sections make the left rail far too long.
    # Without it, each chapter opens and closes on its own.
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  # Brand mark: the round BLPID fingerprint. `theme.logo` overrides
  # `theme.icon.logo`, so the icon key for the logo is gone — the file is the
  # logo now. The same file serves as the favicon.
  logo: assets/logo-blpid.png
  favicon: assets/logo-blpid.png
  # Lucide icon set (files in `overrides/.icons/lucide/`, taken from the
  # `lucide-static` package — the same artwork as `lucide-react`).
  icon:
    menu: lucide/menu
    search: lucide/search
    close: lucide/x
    share: lucide/share-2
    previous: lucide/arrow-left
    next: lucide/arrow-right
    top: lucide/arrow-up
    alternate: lucide/languages
    admonition:
      note: lucide/info
      info: lucide/info
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: lucide/sun-moon
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: lucide/moon
        name: Switch to system preference
  font:
    text: Inter
    code: IBM Plex Mono

extra_css:
  - stylesheets/extra.css

copyright: Copyright &copy; 2026 Indonesia Digital Credential Trust Framework

# Plugins
plugins:
  # English is the default locale and its files carry no suffix. The plugin
  # stays configured so a second language can come back without rebuilding
  # this block, but Indonesian is switched off: `build: false` emits no /id/
  # directory, so every Indonesian URL returns 404 and the language toggle
  # does not render. Bringing it back means flipping that flag, adding
  # `*.id.md` files, and filling in `nav_translations` for the id locale.
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: id
          name: Bahasa Indonesia
          build: false
          site_name: IDCTF
          site_description: Indonesia Digital Credential Trust Framework
          copyright: Copyright &copy; 2026 Indonesia Digital Credential Trust Framework
  - search:
      separator: '[\s​\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - minify:
      minify_html: true

# Additional configuration
extra:
  generator: false
  status:
    new: Newly added
    deprecated: Deprecated
  # Documentation version combobox (navbar dropdown). The version list is in
  # `versions.json` at the project root, and the versioned site is built with
  # `python3 scripts/build_versions.py`. `default` marks which version counts
  # as current — any other version raises the "outdated version" banner.
  version:
    provider: mike
    default: latest

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      # Registers the Lucide icon set so it can be called from Markdown
      # as `:lucide-<name>:`.
      options:
        custom_icons:
          - overrides/.icons
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

