<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 800" width="970" height="800" role="img" aria-labelledby="t d">
<title id="t">Components inside Wallet Services</title><desc id="d">Mobile Wallet in four layers: four protocol clients, five domain components including Trust Display and Consent UI, two providers, and the encrypted Credential Store. Wallet Backend Service below it issues Key Attestations and keeps a device registry that holds no credential data.</desc>
