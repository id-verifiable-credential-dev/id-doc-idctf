<title id="t">The eleven Modules, grouped by Service</title><desc id="d">Four Service columns. Issuer Services holds Issuer Core and Issuer Console, both run many times. Wallet Services holds one Mobile Wallet with millions of installations and a single Wallet Backend Service. Verifier Services holds Verifier Core, Verifier Console and Mobile Verifier. Trust Infrastructure holds Trust Authority, Trust Registry, DID Service and KMS, one of each.</desc>
