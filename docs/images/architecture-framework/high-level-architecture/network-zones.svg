<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 996 652" width="996" height="652" role="img" aria-labelledby="t d">
<title id="t">The five network zones and what sits in each</title><desc id="d">Five bands ordered by exposure. Internet holds Mobile Wallet and Mobile Verifier. Public holds only protocol endpoints and static files. Internal holds the consoles, the Admin API, Trust Authority, the databases and caches, and Claims Provider. Secure holds KMS, the HSM, and both offline CA roots, and admits Trust Authority alone. The closed agency network is drawn detached because it belongs to the agency rather than to the ecosystem, and Claims Provider enters it read-only. Two dotted risers run from the OpenID4VCI and OpenID4VP endpoints down to the Admin API, which is the same application answering on two ingresses.</desc>
