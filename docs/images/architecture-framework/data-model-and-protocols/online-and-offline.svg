<polyline points="640,186 640,213 640,240" fill="none" stroke="#5c7180" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="592.0" y="204.0" width="96.0" height="18" rx="3" fill="#ffffff" fill-opacity="0.94"/>
<text x="640.0" y="217.0" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#4a5f6f">read from cache</text>
<rect x="495" y="240" width="290" height="50" rx="7" fill="#d4edda" stroke="#3c8d5a" stroke-width="1.3"/>
<text x="640.0" y="268.3" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#16242f">Trusted list, status list, VICAL</text>
<text x="640" y="314" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#16242f">network calls: zero</text>
