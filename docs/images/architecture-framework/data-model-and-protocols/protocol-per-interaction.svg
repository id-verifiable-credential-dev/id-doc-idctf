<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 892 512" width="892" height="512" role="img" aria-labelledby="t d">
<title id="t">The protocol behind each interaction</title><desc id="d">Seven interactions and the standard carrying each. Issuer Core issues to Mobile Wallet over OpenID4VCI. Mobile Wallet presents to Verifier Core over OpenID4VP and to Mobile Verifier over ISO/IEC 18013-5, and exchanges a platform attestation with Wallet Backend Service for a Key Attestation. Issuer Core and Verifier Core query Trust Registry over ToIP TRQP. Mobile Verifier carries a Verifier Device Certificate from Verifier Core. Verifier Core hands its result to the Relying Party application over OIDC or SAML.</desc>
