<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 608 308" width="608" height="308" role="img" aria-labelledby="t d">
<title id="t">What one credential carries</title><desc id="d">A credential drawn as a signed envelope. Four things sit inside it: the claims, the type identifier, the holder binding and the status pointer. Across the bottom, inside the same envelope, runs the issuer&#x27;s signature, which covers all four.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5c7180"/></marker></defs>
<rect x="0.5" y="0.5" width="607" height="307" rx="12" fill="#ffffff" stroke="#e2e9f0"/>
<g transform="translate(36,36)">
<rect x="0" y="0" width="536" height="236" rx="10" fill="none" stroke="#b8c4ce" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="14" y="21" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.4" fill="#4a5f6f">CREDENTIAL</text>
<rect x="20" y="40" width="240" height="58" rx="7" fill="#e9ecef" stroke="#6c757d" stroke-width="1.3"/>
<text x="140.0" y="72.3" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#16242f">Claims</text>
<rect x="276" y="40" width="240" height="58" rx="7" fill="#e9ecef" stroke="#6c757d" stroke-width="1.3"/>
<text x="396.0" y="72.3" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#16242f">Type identifier</text>
<rect x="20" y="114" width="240" height="58" rx="7" fill="#e9ecef" stroke="#6c757d" stroke-width="1.3"/>
<text x="140.0" y="146.3" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#16242f">Holder binding</text>
<rect x="276" y="114" width="240" height="58" rx="7" fill="#e9ecef" stroke="#6c757d" stroke-width="1.3"/>
<text x="396.0" y="146.3" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#16242f">Status pointer</text>
<rect x="20" y="188" width="496" height="38" rx="7" fill="#fff3cd" stroke="#d4a017" stroke-width="1.3"/>
<text x="268.0" y="210.3" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#16242f">Issuer signature</text>
</g>
