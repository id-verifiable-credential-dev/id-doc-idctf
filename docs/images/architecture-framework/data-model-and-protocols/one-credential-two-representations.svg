<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 318" width="552" height="318" role="img" aria-labelledby="t d">
<title id="t">One credential, two representations</title><desc id="d">One credential key at the top. Below it the same credential exists twice, once as SD-JWT VC and once as ISO mdoc, both bound to that one key. Each representation serves one mode: SD-JWT VC online, ISO mdoc in proximity.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5c7180"/></marker></defs>
<rect x="0.5" y="0.5" width="551" height="317" rx="12" fill="#ffffff" stroke="#e2e9f0"/>
<g transform="translate(36,36)">
<rect x="160" y="0" width="200" height="50" rx="7" fill="#e2d9f3" stroke="#7d5ba6" stroke-width="1.3"/>
<text x="260.0" y="28.3" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#16242f">Credential key</text>
<polyline points="260,50 260,65 260,80" fill="none" stroke="#5c7180" stroke-width="1.5" stroke-linejoin="round"/>
<polyline points="140,80 260,80 380,80" fill="none" stroke="#5c7180" stroke-width="1.5" stroke-linejoin="round"/>
<polyline points="140,80 140,95 140,110" fill="none" stroke="#5c7180" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="380,80 380,95 380,110" fill="none" stroke="#5c7180" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="110" width="200" height="54" rx="7" fill="#e2d9f3" stroke="#7d5ba6" stroke-width="1.3"/>
<text x="140.0" y="140.3" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#16242f">SD-JWT VC</text>
<rect x="280" y="110" width="200" height="54" rx="7" fill="#e2d9f3" stroke="#7d5ba6" stroke-width="1.3"/>
<text x="380.0" y="140.3" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#16242f">ISO mdoc</text>
<polyline points="140,164 140,182 140,200" fill="none" stroke="#5c7180" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="380,164 380,182 380,200" fill="none" stroke="#5c7180" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="200" width="200" height="46" rx="7" fill="#cfe2ff" stroke="#2f6fd0" stroke-width="1.3"/>
<text x="140.0" y="226.3" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#16242f">Online</text>
<rect x="280" y="200" width="200" height="46" rx="7" fill="#cfe2ff" stroke="#2f6fd0" stroke-width="1.3"/>
<text x="380.0" y="226.3" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#16242f">Proximity</text>
</g>
</svg>
