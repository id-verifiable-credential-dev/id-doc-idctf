<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 712 360" width="712" height="360" role="img" aria-labelledby="t d">
<title id="t">A fresh holder identifier for every credential</title><desc id="d">One citizen holds three credentials, and each carries a different did:key. Each credential goes to a different verifier. Because no identifier is shared between them, two verifiers comparing what they received find nothing in common.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5c7180"/></marker></defs>
<rect x="0.5" y="0.5" width="711" height="359" rx="12" fill="#ffffff" stroke="#e2e9f0"/>
<g transform="translate(36,36)">
<rect x="220" y="0" width="200" height="46" rx="7" fill="#e2d9f3" stroke="#7d5ba6" stroke-width="1.3"/>
<text x="320.0" y="26.3" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#16242f">One citizen</text>
<polyline points="320,46 320,62 320,76" fill="none" stroke="#5c7180" stroke-width="1.5" stroke-linejoin="round"/>
<polyline points="100,76 320,76 540,76" fill="none" stroke="#5c7180" stroke-width="1.5" stroke-linejoin="round"/>
<polyline points="100,76 100,91 100,106" fill="none" stroke="#5c7180" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="0" y="106" width="200" height="58" rx="7" fill="#e2d9f3" stroke="#7d5ba6" stroke-width="1.3"/>
<text x="100.0" y="131.6" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#16242f">KTP Digital</text>
<text x="100.0" y="145.0" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="400" fill="#4a5f6f">did:key A</text>
<polyline points="100,164 100,182 100,200" fill="none" stroke="#5c7180" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="320,76 320,91 320,106" fill="none" stroke="#5c7180" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="220" y="106" width="200" height="58" rx="7" fill="#e2d9f3" stroke="#7d5ba6" stroke-width="1.3"/>
<text x="320.0" y="131.6" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#16242f">Driving license</text>
<text x="320.0" y="145.0" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="400" fill="#4a5f6f">did:key B</text>
<polyline points="320,164 320,182 320,200" fill="none" stroke="#5c7180" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="540,76 540,91 540,106" fill="none" stroke="#5c7180" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="440" y="106" width="200" height="58" rx="7" fill="#e2d9f3" stroke="#7d5ba6" stroke-width="1.3"/>
<text x="540.0" y="131.6" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#16242f">Diploma</text>
<text x="540.0" y="145.0" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="400" fill="#4a5f6f">did:key C</text>
<polyline points="540,164 540,182 540,200" fill="none" stroke="#5c7180" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="0" y="200" width="200" height="46" rx="7" fill="#cfe2ff" stroke="#2f6fd0" stroke-width="1.3"/>
<text x="100.0" y="226.3" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#16242f">Verifier 1</text>
<rect x="220" y="200" width="200" height="46" rx="7" fill="#cfe2ff" stroke="#2f6fd0" stroke-width="1.3"/>
<text x="320.0" y="226.3" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#16242f">Verifier 2</text>
<rect x="440" y="200" width="200" height="46" rx="7" fill="#cfe2ff" stroke="#2f6fd0" stroke-width="1.3"/>
<text x="540.0" y="226.3" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#16242f">Verifier 3</text>
<text x="320" y="288" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#4a5f6f">no identifier in common, so two verifiers cannot tell these are one citizen</text>
</g>
</svg>
