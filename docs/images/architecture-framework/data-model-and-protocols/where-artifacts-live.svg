<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 636 582" width="636" height="582" role="img" aria-labelledby="t d">
<title id="t">Where each artifact lives</title><desc id="d">Four columns, one per place an artifact can sit. On the central CDN: the trusted list, the Credential Rulebook and VICAL. On the entity&#x27;s own domain: the DID Document and the status list. Answered on request rather than published: the Authority Statement. Carried in the exchange itself: the Accreditation Credential, the Key Attestation, the Verifier Device Certificate, the credential, the presentation and the Document Signer Certificate. Box color marks the Service that issues the artifact.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5c7180"/></marker></defs>
