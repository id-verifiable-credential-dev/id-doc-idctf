<title id="t">Components inside Trust Infrastructure</title><desc id="d">Trust Authority with its registrar controller, five domain services including the Certificate Authority, and two repositories. Trust Registry, which answers TRQP and publishes the static artifacts. DID Service, which issues and resolves did:webvh. KMS, whose Key Controller exposes no sign operation.</desc>
