<title id="t">Components inside Trust Infrastructure</title><desc id="d">Trust Authority with its registrar controller, four domain services including the Certificate Authority, and three repositories including the Public Key Registry. Trust Registry, which answers TRQP and publishes the static artifacts. DID Service, which witnesses and resolves did:webvh.</desc>
