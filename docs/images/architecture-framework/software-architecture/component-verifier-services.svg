<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 772 996" width="772" height="996" role="img" aria-labelledby="t d">
<title id="t">Components inside Verifier Services</title><desc id="d">Verifier Core with three controllers, three domain services including Trust Evaluator, two providers and a repository. Verifier Console with three views and a client. Mobile Verifier, which runs on a merchant or counter device with no server, is the only proximity reader, and whose Activity Repository holds no citizen attribute.</desc>
