<title id="t">Trust SDK: six parts, and the four Modules that embed it</title><desc id="d">The Trust SDK is a library rather than a Module. Six parts, of which the DID Resolver Client and the X.509 Validator carry the highest risk of the Go and Dart implementations drifting apart. It is embedded as a Provider-layer component in Issuer Core, Verifier Core, Mobile Wallet and Mobile Verifier, and in no other Module.</desc>
